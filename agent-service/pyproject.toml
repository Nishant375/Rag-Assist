[project]
name = "rag-assist"
version = "1.0.0"
description = "Upload your documents and chat with them using AI — Corrective RAG + Groq + pgvector"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    # Embeddings
    "langchain-google-genai>=2.0.0",
    # Vector stores
    "pinecone>=5.0.0",
    "psycopg2-binary>=2.9.0",
    # Document readers
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # OCR fallback for scanned / image-only PDFs (needs tesseract + poppler at runtime)
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    # Config
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
]

[dependency-groups]
dev = []
