# Local dev stack — Postgres + pgvector + pgAdmin UI
# Run:  docker compose -f docker-compose.dev.yml up -d

services:

  # ── Postgres with pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16      # official image with pgvector pre-installed
    container_name: crag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB:       ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persists across restarts

  # ── pgAdmin — visual DB browser ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crag-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@ragapp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  postgres_data:
