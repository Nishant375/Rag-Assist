name: Frontend

# Pipeline for the frontend (frontend/): React + TypeScript SPA.
#   • CI  — runs automatically on every push to main and every PR.
#   • Deploy — MANUAL ("Run workflow"). Deploys to InsForge frontend hosting
#     (Vercel). The manual trigger is the approval gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public backend origin the SPA talks to at runtime (baked in at build time).
  VITE_API_URL: https://rag-assist-api-2c425752-0061-4a84-8efd-8af5b5022cbe.fly.dev

defaults:
  run:
    working-directory: frontend

jobs:
  # ── CI ─────────────────────────────────────────────────────────────────────
  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

  # ── Deploy (manual) ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy frontend
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      INSFORGE_EMAIL: ${{ secrets.INSFORGE_EMAIL }}
      INSFORGE_PASSWORD: ${{ secrets.INSFORGE_PASSWORD }}
      INSFORGE_PROJECT_ID: ${{ secrets.INSFORGE_PROJECT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy credentials are present
        run: |
          missing=0
          for v in INSFORGE_EMAIL INSFORGE_PASSWORD INSFORGE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Required secret $v is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Set the secrets in Settings → Environments → production, then re-run."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Authenticate InsForge CLI
        run: |
          npx -y @insforge/cli login --email --json
          npx -y @insforge/cli link \
            --project-id "${{ secrets.INSFORGE_PROJECT_ID }}" \
            --org-id "${{ secrets.INSFORGE_ORG_ID }}" -y

      - name: Deploy to InsForge (Vercel)
        run: |
          npx -y @insforge/cli deployments deploy . \
            --env "{\"VITE_API_URL\":\"${VITE_API_URL}\"}"
