name: CI & Deploy to InsForge

# CI runs automatically on every push and PR.
# Deploy is MANUAL: it only runs via "Run workflow" (workflow_dispatch), which
# requires repo write access — that click is the approval gate. (Free private
# repos can't use Environment required reviewers, so this is the equivalent.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Never let two runs of the same ref deploy on top of each other.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

# Built-in token only needs to push images to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Public Fly endpoint of the API service — used for the post-deploy health check.
  API_HEALTH_URL: https://rag-assist-api-2c425752-0061-4a84-8efd-8af5b5022cbe.fly.dev/health

jobs:
  # ── 1a. Backend CI: syntax check + verify the API image builds ─────────────
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax / import compile check
        run: python -m compileall -q agent-service

      - name: Build API image (smoke test)
        run: docker build -f agent-service/Dockerfile -t rag-assist-api:ci agent-service

  # ── 1b. Frontend CI: type-check + production build ─────────────────────────
  ci-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

  # ── 2. Deploy: push images to GHCR, roll InsForge compute services ─────────
  deploy:
    name: Deploy to InsForge
    needs: ci
    # Manual gate: only runs when a maintainer triggers "Run workflow" on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `production` environment scopes the deploy secrets to this job (works on
    # free private repos). The approval gate itself is the manual workflow_dispatch
    # trigger above — Environment "required reviewers" need a paid plan on private
    # repos, so we don't rely on them here.
    environment: production
    # Machine auth: non-interactive email/password login. OAuth access tokens
    # are short-lived (hours) and can't be used as a static CI secret, so we log
    # in with credentials each run. Use a dedicated InsForge account/password.
    env:
      INSFORGE_EMAIL: ${{ secrets.INSFORGE_EMAIL }}
      INSFORGE_PASSWORD: ${{ secrets.INSFORGE_PASSWORD }}
      INSFORGE_PROJECT_ID: ${{ secrets.INSFORGE_PROJECT_ID }}
      # Discourage any interactive prompts in CI.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Fail fast instead of hanging on the CLI's interactive OAuth login when
      # credentials are missing.
      - name: Verify deploy credentials are present
        run: |
          missing=0
          for v in INSFORGE_EMAIL INSFORGE_PASSWORD INSFORGE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Required secret $v is not set"; missing=1; fi
          done
          if [ -z "${{ secrets.INSFORGE_API_SERVICE_ID }}" ]; then
            echo "::error::Required secret INSFORGE_API_SERVICE_ID is not set"; missing=1
          fi
          [ "$missing" = "0" ] || { echo "Set the secrets in Settings → Secrets and variables → Actions, then re-run."; exit 1; }

      - name: Authenticate InsForge CLI
        run: |
          npx -y @insforge/cli login --email --json
          npx -y @insforge/cli link \
            --project-id "${{ secrets.INSFORGE_PROJECT_ID }}" \
            --org-id "${{ secrets.INSFORGE_ORG_ID }}" -y

      - name: Lowercase image base
        id: img
        run: echo "base=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Images can stay PRIVATE: keep the GHCR packages private and have
      # InsForge register a read:packages PAT as the project's pull credential
      # (see .github/BRANCH_PROTECTION.md). No workflow change needed for that.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-service
          file: ./agent-service/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-api:latest
            ${{ steps.img.outputs.base }}-api:${{ github.sha }}

      - name: Roll API compute service to new image
        run: |
          npx -y @insforge/cli compute update "${{ secrets.INSFORGE_API_SERVICE_ID }}" \
            --image "${{ steps.img.outputs.base }}-api:${{ github.sha }}"

      - name: Post-deploy health check (API)
        run: |
          echo "Waiting for $API_HEALTH_URL to report healthy ..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API_HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "API healthy ✅"
              exit 0
            fi
            echo "attempt $i: not ready yet, retrying in 10s ..."
            sleep 10
          done
          echo "::error::API did not become healthy after rollout"
          exit 1
