[project]
name = "documind"
version = "0.1.0"
description = "Upload your documents and chat with them using AI — powered by Corrective RAG, Groq LLM, and pgvector"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Vector store
    "pinecone>=5.0.0",
    "psycopg2-binary>=2.9.0",   # postgres + pgvector
    # Document loaders
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Embeddings (cloud option for deployment without Ollama)
    "langchain-google-genai>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # UI
    "streamlit>=1.35.0",
    # Config
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
# Only needed for Google Drive ingestion
gdrive = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
]

[project.scripts]
ingest = "ingest:main"
chat   = "app:main"

[dependency-groups]
dev = []
